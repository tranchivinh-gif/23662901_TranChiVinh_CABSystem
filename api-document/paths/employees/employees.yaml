driverMe:
  get:
    tags: [Drivers]
    summary: Get driver profile
    operationId: getDriverProfile
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: Driver profile, content: { application/json: { schema: { $ref: '../../schemas/common.yaml#/schemas/User' } } } }
      '401': { $ref: '../../responses/responses.yaml#/Unauthorized' }
  put:
    tags: [Drivers]
    summary: Update driver profile
    operationId: updateDriverProfile
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../../schemas/common.yaml#/schemas/UpdateProfileRequest' } } }
    responses:
      '200': { description: Updated driver profile, content: { application/json: { schema: { $ref: '../../schemas/common.yaml#/schemas/User' } } } }
      '400': { $ref: '../../responses/responses.yaml#/BadRequest' }
      '401': { $ref: '../../responses/responses.yaml#/Unauthorized' }
driverLocation:
  put:
    tags: [Drivers]
    summary: Update active driver location
    operationId: updateDriverLocation
    description: SRS baseline targets approximately one update every 10 seconds while active.
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../../schemas/common.yaml#/schemas/Location' } } }
    responses:
      '204': { description: Location recorded }
      '400': { $ref: '../../responses/responses.yaml#/BadRequest' }
      '401': { $ref: '../../responses/responses.yaml#/Unauthorized' }
driverAvailability:
  put:
    tags: [Drivers]
    summary: Update driver availability
    operationId: updateDriverAvailability
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [available]
            properties: { available: { type: boolean } }
    responses:
      '204': { description: Availability updated }
      '400': { $ref: '../../responses/responses.yaml#/BadRequest' }
      '401': { $ref: '../../responses/responses.yaml#/Unauthorized' }

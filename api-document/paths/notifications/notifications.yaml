paths:
  /notifications:
    get:
      tags:
      - Notifications
      summary: Xem danh sách thông báo của tài khoản hiện tại
      description: "QRY-NOT-001. Returns only notifications belonging to the authenticated Customer or Driver, newest first. `isRead` is read from persistent Notifications PostgreSQL state."
      x-contract-id: QRY-NOT-001
      x-contract-status: FINALIZED
      operationId: listNotifications
      x-roles:
      - Customer
      - Driver
      x-use-cases:
      - UC-21
      security:
      - bearerAuth: []
      parameters:
      - $ref: ../../parameters/pagination.yaml#/PageParam
      - $ref: ../../parameters/pagination.yaml#/LimitParam
      responses:
        '200':
          description: Recipient-scoped notification page; persisted read state is included.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: ../../schemas/notification/Notification.yaml
                  pagination:
                    $ref: ../../schemas/common/Pagination.yaml
        '401':
          $ref: ../../responses/unauthorized.yaml
        '500':
          $ref: ../../responses/server-error.yaml
  /notifications/{notificationId}/read:
    patch:
      tags:
      - Notifications
      summary: Đánh dấu thông báo đã đọc
      description: "QRY-NOT-001. Idempotently changes `isRead` from false to true for a notification owned by the authenticated recipient. The updated persisted notification is returned. A missing or non-owned notification returns 404."
      x-contract-id: QRY-NOT-001
      x-contract-status: FINALIZED
      operationId: markNotificationRead
      x-roles:
      - Customer
      - Driver
      x-use-cases:
      - UC-21
      security:
      - bearerAuth: []
      parameters:
      - $ref: ../../parameters/id.yaml#/NotificationIdParam
      responses:
        '200':
          description: Updated notification with persistent `isRead=true`.
          content:
            application/json:
              schema:
                $ref: ../../schemas/notification/Notification.yaml
        '401':
          $ref: ../../responses/unauthorized.yaml
        '404':
          $ref: ../../responses/not-found.yaml
        '500':
          $ref: ../../responses/server-error.yaml

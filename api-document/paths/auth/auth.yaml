paths:
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Đăng ký tài khoản khách hàng
      operationId: registerCustomer
      x-roles: []
      x-use-cases:
      - UC-01
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/customer/RegisterCustomerRequest.yaml
      responses:
        '201':
          description: Đăng ký thành công.
          content:
            application/json:
              schema:
                $ref: ../../schemas/customer/Customer.yaml
        '400':
          $ref: ../../responses/bad-request.yaml
        '409':
          $ref: ../../responses/conflict.yaml
        '500':
          $ref: ../../responses/server-error.yaml
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Đăng nhập bằng số điện thoại và mật khẩu
      operationId: loginUser
      x-roles: []
      x-use-cases:
      - UC-02
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phoneNumber
              - password
              properties:
                phoneNumber:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                type: object
                required:
                - accessToken
                - tokenType
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    example: bearer
        '401':
          $ref: ../../responses/unauthorized.yaml
        '400':
          $ref: ../../responses/bad-request.yaml
        '500':
          $ref: ../../responses/server-error.yaml

  /auth/register-driver:
    post:
      tags: [Authentication]
      summary: Tài xế tự đăng ký, chờ duyệt
      operationId: registerDriver
      x-baseline-requirements: [BR-21, FR-36]
      x-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/driver/DriverRegistrationRequest.yaml
      responses:
        '201':
          description: Hồ sơ tạo với PendingApproval và Unavailable.
          content:
            application/json:
              schema:
                $ref: ../../schemas/driver/Driver.yaml
        '400':
          $ref: ../../responses/bad-request.yaml
        '409':
          $ref: ../../responses/conflict.yaml
        '500':
          $ref: ../../responses/server-error.yaml

register:
  post:
    tags: [Authentication]
    summary: Register customer account
    operationId: register
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../../schemas/common.yaml#/schemas/RegisterRequest' } } }
    responses:
      '201': { description: Account created, content: { application/json: { schema: { $ref: '../../schemas/common.yaml#/schemas/User' } } } }
      '400': { $ref: '../../responses/responses.yaml#/BadRequest' }
      '409': { $ref: '../../responses/responses.yaml#/Conflict' }
login:
  post:
    tags: [Authentication]
    summary: Login and issue JWT
    operationId: login
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../../schemas/common.yaml#/schemas/LoginRequest' } } }
    responses:
      '200': { description: Authenticated, content: { application/json: { schema: { $ref: '../../schemas/common.yaml#/schemas/AuthResponse' } } } }
      '400': { $ref: '../../responses/responses.yaml#/BadRequest' }
      '401': { $ref: '../../responses/responses.yaml#/Unauthorized' }
      '500': { $ref: '../../responses/responses.yaml#/ServerError' }
me:
  get:
    tags: [Authentication]
    summary: Get current authenticated user
    operationId: getCurrentUser
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: Current user, content: { application/json: { schema: { $ref: '../../schemas/common.yaml#/schemas/User' } } } }
      '401': { $ref: '../../responses/responses.yaml#/Unauthorized' }

paths:
  /payments/quote:
    post:
      tags:
      - Payments
      summary: Tính cước theo loại phương tiện và quãng đường
      operationId: quoteFare
      x-roles: []
      x-use-cases:
      - UC-17
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - vehicleType
              - distanceKm
              properties:
                vehicleType:
                  type: string
                  enum:
                  - Xe máy
                  - Ô tô 4 chỗ
                  - Ô tô 7 chỗ
                distanceKm:
                  type: number
                  format: double
      responses:
        '200':
          description: Fare được tính.
          content:
            application/json:
              schema:
                $ref: ../../schemas/trip/Fare.yaml
        '400':
          $ref: ../../responses/bad-request.yaml
        '500':
          $ref: ../../responses/server-error.yaml
  /payments:
    post:
      tags:
      - Payments
      summary: Tạo giao dịch thanh toán
      operationId: createPayment
      x-baseline-requirements: [BR-23, FR-38]
      x-roles:
      - Customer
      x-use-cases:
      - UC-18
      - UC-19
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/payment/PaymentCreateRequest.yaml
      responses:
        '201':
          description: Payment được tạo.
          content:
            application/json:
              schema:
                $ref: ../../schemas/payment/Payment.yaml
        '400':
          $ref: ../../responses/bad-request.yaml
        '401':
          $ref: ../../responses/unauthorized.yaml
        '404':
          $ref: ../../responses/not-found.yaml
        '500':
          $ref: ../../responses/server-error.yaml
  /payments/{paymentId}:
    get:
      tags:
      - Payments
      summary: Xem giao dịch thanh toán
      operationId: getPayment
      x-roles:
      - Customer
      - OperationsStaff
      x-use-cases:
      - UC-18
      - UC-19
      - UC-20
      - UC-36
      security:
      - bearerAuth: []
      parameters:
      - $ref: ../../parameters/id.yaml#/PaymentIdParam
      responses:
        '200':
          description: Payment.
          content:
            application/json:
              schema:
                $ref: ../../schemas/payment/Payment.yaml
        '401':
          $ref: ../../responses/unauthorized.yaml
        '403':
          $ref: ../../responses/forbidden.yaml
        '404':
          $ref: ../../responses/not-found.yaml
        '500':
          $ref: ../../responses/server-error.yaml
  /payments/{paymentId}/retry:
    post:
      tags:
      - Payments
      summary: Retry thanh toán điện tử
      operationId: retryPayment
      x-roles:
      - Customer
      x-use-cases:
      - UC-20
      security:
      - bearerAuth: []
      parameters:
      - $ref: ../../parameters/id.yaml#/PaymentIdParam
      responses:
        '200':
          description: Payment sau retry.
          content:
            application/json:
              schema:
                $ref: ../../schemas/payment/Payment.yaml
        '400':
          $ref: ../../responses/bad-request.yaml
        '401':
          $ref: ../../responses/unauthorized.yaml
        '404':
          $ref: ../../responses/not-found.yaml
        '409':
          $ref: ../../responses/conflict.yaml
        '500':
          $ref: ../../responses/server-error.yaml
  /payments/webhook:
    post:
      tags:
      - Payments
      summary: Nhận kết quả thanh toán từ VNPAY Sandbox
      operationId: paymentWebhook
      x-baseline-requirements: [BR-23, FR-38]
      x-roles: []
      x-use-cases:
      - UC-19
      - UC-20
      security: []
      parameters:
      - name: X-Provider-Signature
        in: header
        required: true
        description: Provider-specific callback signature; verify before processing.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/payment/PaymentWebhookRequest.yaml
      responses:
        '200':
          description: Kết quả được ghi nhận.
        '400':
          $ref: ../../responses/bad-request.yaml
        '404':
          $ref: ../../responses/not-found.yaml
        '500':
          $ref: ../../responses/server-error.yaml

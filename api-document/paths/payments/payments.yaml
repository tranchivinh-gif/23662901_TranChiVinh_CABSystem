fare:
  get:
    tags: [Payments]
    summary: Get calculated trip fare
    operationId: getTripFare
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: '../../parameters/parameters.yaml#/TripId' }]
    responses:
      '200': { description: Fare, content: { application/json: { schema: { $ref: '../../schemas/common.yaml#/schemas/Fare' } } } }
      '404': { $ref: '../../responses/responses.yaml#/NotFound' }
cashPayment:
  post:
    tags: [Payments]
    summary: Confirm cash collection
    operationId: confirmCashPayment
    description: Cash payment is complete only after the driver confirms the full amount was collected.
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: '../../parameters/parameters.yaml#/TripId' }]
    responses:
      '200': { description: Cash payment, content: { application/json: { schema: { $ref: '../../schemas/common.yaml#/schemas/Payment' } } } }
      '400': { $ref: '../../responses/responses.yaml#/BadRequest' }
      '409': { $ref: '../../responses/responses.yaml#/Conflict' }
electronicPayment:
  post:
    tags: [Payments]
    summary: Start electronic payment
    operationId: startElectronicPayment
    description: CAB stores only provider transaction identifier and status. Retry is limited to three attempts within 30 minutes.
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: '../../parameters/parameters.yaml#/TripId' }]
    requestBody:
      required: true
      content: { application/json: { schema: { $ref: '../../schemas/common.yaml#/schemas/ElectronicPaymentRequest' } } }
    responses:
      '202': { description: Payment submitted, content: { application/json: { schema: { $ref: '../../schemas/common.yaml#/schemas/Payment' } } } }
      '400': { $ref: '../../responses/responses.yaml#/BadRequest' }
      '409': { $ref: '../../responses/responses.yaml#/Conflict' }
payments:
  get:
    tags: [Payments]
    summary: List trip payment attempts
    operationId: listTripPayments
    security: [{ bearerAuth: [] }]
    parameters: [{ $ref: '../../parameters/parameters.yaml#/TripId' }]
    responses:
      '200': { description: Payment records, content: { application/json: { schema: { $ref: '../../schemas/common.yaml#/schemas/Page' } } } }

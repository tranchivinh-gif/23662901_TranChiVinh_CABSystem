type: object
required:
- notificationId
- recipientAccountId
- notificationType
- tripId
- title
- content
- isRead
- createdAt
properties:
  notificationId:
    type: integer
    format: int32
    example: 1
  recipientAccountId:
    type: integer
    format: int32
    example: 1
  tripId:
    type: integer
    format: int32
    example: 1
  notificationType:
    type: string
    description: Type derived from one of the four baseline event facts.
    enum: [TripLifecycleChanged, TripCompleted, TripCanceled, PaymentOutcomeRecorded]
  title:
    type: string
  content:
    type: string
  isRead:
    type: boolean
    description: Persistent recipient read state; false on creation and true after mark-read.
  createdAt:
    type: string
    format: date-time
    example: '2026-09-24T12:00:00Z'

schemas:
  Error:
    type: object
    required: [code, message]
    properties:
      code: { type: string, example: VALIDATION_ERROR }
      message: { type: string, example: Request data is invalid. }
      details: { type: array, items: { type: object, additionalProperties: true } }
      traceId: { type: string }
  User:
    type: object
    required: [id, email, role]
    properties:
      id: { type: string, format: uuid }
      email: { type: string, format: email }
      fullName: { type: string }
      phone: { type: string }
      role: { type: string, enum: [CUSTOMER, DRIVER, OPERATOR, ADMIN] }
      status: { type: string, enum: [ACTIVE, LOCKED] }
  RegisterRequest:
    type: object
    required: [email, password, fullName]
    properties:
      email: { type: string, format: email }
      password: { type: string, format: password }
      fullName: { type: string, minLength: 1 }
      phone: { type: string }
  LoginRequest:
    type: object
    required: [email, password]
    properties:
      email: { type: string, format: email }
      password: { type: string, format: password }
  AuthResponse:
    type: object
    required: [accessToken, user]
    properties:
      accessToken: { type: string }
      tokenType: { type: string, example: Bearer }
      expiresIn: { type: integer, format: int32 }
      user: { $ref: '#/schemas/User' }
  UpdateProfileRequest:
    type: object
    properties:
      fullName: { type: string }
      phone: { type: string }
  Location:
    type: object
    required: [latitude, longitude]
    properties:
      latitude: { type: number, format: double, minimum: -90, maximum: 90 }
      longitude: { type: number, format: double, minimum: -180, maximum: 180 }
      recordedAt: { type: string, format: date-time }
  Trip:
    type: object
    required: [id, pickup, destination, vehicleType, status]
    properties:
      id: { type: string, format: uuid }
      customerId: { type: string, format: uuid }
      driverId: { type: string, format: uuid, nullable: true }
      pickup: { $ref: '#/schemas/Location' }
      destination: { $ref: '#/schemas/Location' }
      vehicleType: { type: string }
      status:
        type: string
        enum: [RECEIVED, SEARCHING_DRIVER, DRIVER_ASSIGNED, DRIVER_ARRIVED, PASSENGER_PICKED_UP, IN_PROGRESS, COMPLETED, CANCELLED, INCIDENT]
      etaSeconds: { type: integer, nullable: true }
      createdAt: { type: string, format: date-time }
  CreateTripRequest:
    type: object
    required: [pickup, destination, vehicleType]
    properties:
      pickup: { $ref: '#/schemas/Location' }
      destination: { $ref: '#/schemas/Location' }
      vehicleType: { type: string }
  DriverResponseRequest:
    type: object
    required: [response]
    properties:
      response: { type: string, enum: [ACCEPT, REJECT] }
      reason: { type: string }
  StatusUpdateRequest:
    type: object
    required: [status]
    properties:
      status: { $ref: '#/schemas/Trip/properties/status' }
  IncidentRequest:
    type: object
    required: [description]
    properties:
      description: { type: string, minLength: 1 }
      type: { type: string }
  Incident:
    type: object
    required: [id, tripId, description, status]
    properties:
      id: { type: string, format: uuid }
      tripId: { type: string, format: uuid }
      description: { type: string }
      type: { type: string }
      status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }
  Fare:
    type: object
    required: [tripId, amount, currency, status]
    properties:
      tripId: { type: string, format: uuid }
      amount: { type: number, format: decimal, minimum: 0 }
      currency: { type: string, example: VND }
      basis: { type: string }
      status: { type: string, enum: [CALCULATED, PENDING_CONFIRMATION] }
  Payment:
    type: object
    required: [id, tripId, method, status]
    properties:
      id: { type: string, format: uuid }
      tripId: { type: string, format: uuid }
      method: { type: string, enum: [CASH, ELECTRONIC] }
      status: { type: string, enum: [PENDING, PROCESSING, SUCCEEDED, FAILED] }
      providerTransactionId: { type: string, nullable: true }
  ElectronicPaymentRequest:
    type: object
    required: [provider, paymentToken]
    properties:
      provider: { type: string }
      paymentToken: { type: string, description: Token from provider; CAB does not store sensitive payment data. }
  Notification:
    type: object
    required: [id, eventType, recipientId, channel, status]
    properties:
      id: { type: string, format: uuid }
      eventType: { type: string }
      recipientId: { type: string, format: uuid }
      channel: { type: string, enum: [IN_APP, EMAIL] }
      status: { type: string, enum: [PENDING, SENT, FAILED] }
      attempts: { type: integer, maximum: 3 }
  NotificationPage:
    type: object
    required: [items, page, pageSize, total]
    properties:
      items: { type: array, items: { $ref: '#/schemas/Notification' } }
      page: { type: integer, minimum: 1 }
      pageSize: { type: integer, minimum: 1 }
      total: { type: integer, minimum: 0 }
  Report:
    type: object
    properties:
      from: { type: string, format: date-time }
      to: { type: string, format: date-time }
      totalTrips: { type: integer }
      completedTrips: { type: integer }
      cancelledTrips: { type: integer }
      revenue: { type: number, format: decimal }
      completionRate: { type: number, format: double }
      cancellationRate: { type: number, format: double }
  Page:
    type: object
    properties:
      items: { type: array, items: { type: object, additionalProperties: true } }
      page: { type: integer, minimum: 1 }
      pageSize: { type: integer, minimum: 1 }
      total: { type: integer, minimum: 0 }

TripId:
  name: tripId
  in: path
  required: true
  description: Unique trip identifier.
  schema:
    type: string
    format: uuid
Page:
  name: page
  in: query
  description: One-based page number.
  schema:
    type: integer
    minimum: 1
    default: 1
PageSize:
  name: pageSize
  in: query
  description: Number of records per page.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20

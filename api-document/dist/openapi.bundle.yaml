components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu đầu vào không hợp lệ
        details:
          type: array
          items:
            type: string
          example:
            - Dữ liệu không hợp lệ
    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          example: 20
        total:
          type: integer
          minimum: 0
          example: 100
    Account:
      type: object
      required:
        - accountId
        - phoneNumber
        - role
      properties:
        accountId:
          type: integer
          format: int32
          example: 1
        phoneNumber:
          type: string
          example: 901234567
        password:
          type: string
          format: password
          writeOnly: true
          example: Abc@12345
        role:
          type: string
          enum:
            - Customer
            - Driver
            - OperationsStaff
            - OperationsSupervisor
            - Leadership
          example: Customer
    Customer:
      type: object
      required:
        - customerId
        - accountId
        - fullName
        - phoneNumber
        - email
        - address
        - isDeleted
      properties:
        customerId:
          type: integer
          format: int32
          example: 1
        accountId:
          type: integer
          format: int32
          example: 1
        fullName:
          type: string
          example: Nguyễn Văn A
        phoneNumber:
          type: string
          example: 901234567
        email:
          type: string
          format: email
          example: customer@example.com
        address:
          type: string
          example: 123 Lê Lợi, Q1, TP.HCM
        isDeleted:
          type: boolean
          example: false
    CustomerCreateRequest:
      type: object
      required:
        - accountId
        - fullName
        - phoneNumber
        - email
        - address
      properties:
        accountId:
          type: integer
          format: int32
          example: 1
        fullName:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
    CustomerUpdateRequest:
      type: object
      required:
        - fullName
        - phoneNumber
        - email
        - address
      properties:
        fullName:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
    RegisterCustomerRequest:
      type: object
      required:
        - phoneNumber
        - password
        - fullName
        - email
        - address
      properties:
        phoneNumber:
          type: string
          example: 901234567
        password:
          type: string
          format: password
          example: Abc@12345
        fullName:
          type: string
          example: Nguyễn Văn A
        email:
          type: string
          format: email
          example: customer@example.com
        address:
          type: string
          example: 123 Lê Lợi, Q1, TP.HCM
    Driver:
      type: object
      required:
        - driverId

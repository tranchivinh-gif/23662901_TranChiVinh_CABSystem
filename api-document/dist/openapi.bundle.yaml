openapi: 3.0.3
info:
  title: CAB System API
  version: 1.1.0
  description: API contract theo SRS CAB System hiện hành trong workspace, gồm baseline điều chỉnh 1.1.0.
servers:
  - url: /api/v1
    description: Base URL
tags:
  - name: Authentication
  - name: Customers
  - name: Drivers
  - name: Vehicles
  - name: Trip Requests
  - name: Driver Assignments
  - name: Trips
  - name: Payments
  - name: Notifications
  - name: Operations
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Đăng ký tài khoản khách hàng
      operationId: registerCustomer
      x-roles: []
      x-use-cases:
        - UC-01
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
      responses:
        '201':
          description: Đăng ký thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/bad-request'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/server-error'
  /auth/register-driver:
    post:
      tags:
        - Authentication
      summary: Tài xế tự đăng ký, chờ duyệt
      operationId: registerDriver
      x-baseline-requirements:
        - BR-21
        - FR-36
      x-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRegistrationRequest'
      responses:
        '201':
          description: Hồ sơ tạo với PendingApproval và Unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          $ref: '#/components/responses/bad-request'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/server-error'
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập bằng số điện thoại và mật khẩu
      operationId: loginUser
      x-roles: []
      x-use-cases:
        - UC-02
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phoneNumber
                - password
              properties:
                phoneNumber:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - tokenType
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    example: bearer
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/server-error'
  /customers:
    post:
      tags:
        - Customers
      summary: Operations Staff tạo Customer
      operationId: createCustomer
      x-roles:
        - OperationsStaff
        - OperationsSupervisor
      x-use-cases:
        - UC-23
      security:

      secret-bootstrap:
        condition: service_completed_successfully
  kafka:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    platform: linux/amd64
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '1'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: '168'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_HEAP_OPTS: '-Xms256m -Xmx512m'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 40s
    stop_grace_period: 30s
  identity-account-service:
    image: cab-demo-identity-account-service:local
    build:
      context: .
      dockerfile: services/identity-account-service/Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    command:
      - services/identity-account-service/src/index.js
    environment:
      GRPC_BIND_HOST: 0.0.0.0
      IDENTITY_ACCOUNT_GRPC_PORT: '9091'
      IDENTITY_ACCOUNT_DB_HOST: identity-account-db
      IDENTITY_ACCOUNT_DB_PORT: '5432'
      IDENTITY_ACCOUNT_DB_NAME: identity_account_db
      IDENTITY_ACCOUNT_DB_USER: cab_identity
      CAB_JWT_PUBLIC_KEY_PATH: /run/cab-secrets/jwt-public.pem
      CAB_JWT_PRIVATE_KEY_PATH: /run/cab-private/jwt-private.pem
      DRIVER_GRPC_HOST: driver-service
      DRIVER_GRPC_PORT: '9093'
      CUSTOMER_GRPC_HOST: customer-service
      CUSTOMER_GRPC_PORT: '9092'
      CAB_EVENTS_ENABLED: 'true'
      KAFKA_BROKERS: kafka:9092
      CAB_APP_NAME: identity-account-service
      CAB_PROFILE: demo-test
      NODE_ENV: development
      CAB_JWT_ACTIVE_KEY_ID: v1
      CAB_PII_ACTIVE_KEY_ID: v1
      CAB_JWT_ISSUER: cab-system
      CAB_JWT_AUDIENCE: cab-public-api
    networks:
      - backend
    depends_on:
      identity-account-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /bin/sh
        - /app/infra/app-start.sh
        - scripts/runtime-health.js
        - identity-account-service
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    stop_grace_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    volumes:
      - cab-secrets:/run/cab-secrets:ro
      - cab-private:/run/cab-private:ro

    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity_account_db
      POSTGRES_USER: postgres
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
      CAB_DB_PREFIX: IDENTITY_ACCOUNT
      CAB_RUNTIME_USER: cab_identity
      CAB_MIGRATION_USER: cab_identity_migrator
    volumes:
      - identity-account-db-data:/var/lib/postgresql/data
      - ./infra/db-init/20-create-service-roles.sh:/docker-entrypoint-initdb.d/20-create-service-roles.sh:ro
      - ./infra/db-env.sh:/usr/local/bin/cab-db-env.sh:ro
      - ./infra/db-start.sh:/usr/local/bin/cab-db-start.sh:ro
      - ./infra/db-health.sh:/usr/local/bin/cab-db-health.sh:ro
      - cab-secrets:/run/cab-secrets:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - /bin/sh
        - /usr/local/bin/cab-db-health.sh
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    entrypoint:
      - /bin/sh
      - /usr/local/bin/cab-db-start.sh
    depends_on:
      secret-bootstrap:
        condition: service_completed_successfully

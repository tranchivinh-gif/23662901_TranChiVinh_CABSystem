    platform: linux/amd64
    restart: unless-stopped
    environment: {}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/cab-redis-start.sh
    volumes:
      - redis-data:/data
      - ./infra/redis/start.sh:/usr/local/bin/cab-redis-start.sh:ro

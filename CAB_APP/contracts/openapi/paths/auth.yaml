authRegisterDriver:
  post:
    tags:
    - Auth
    - Driver
    summary: Tạo hồ sơ Driver Pending
    operationId: registerDriver
    security: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: ../components/schemas/auth.yaml#/DriverRegistrationMultipart
          encoding:
            profile:
              contentType: application/json
    responses:
      '201':
        description: Driver profile Pending.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/DriverRegistrationResponse
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '409':
        $ref: ../components/responses.yaml#/Conflict
    x-cab-trace:
    - GA-07
    - UC-11
    - FR-15
    - PC-34
    - PC-60
    x-contract-confidence: DESIGN_LOCKED
    description: Self-registration dùng multipart/form-data để gửi profile + required documents. Missing registrationContext
      → 400; invalid/expired → 401. Valid request tạo Driver PENDING.
    parameters:
    - $ref: ../components/parameters.yaml#/CorrelationId
    x-cab-owner-service: identity-account-service
    x-cab-public-via: api-gateway
    x-cab-internal-transport: gRPC
    x-cab-orchestrates:
    - identity-account-service
    - driver-service

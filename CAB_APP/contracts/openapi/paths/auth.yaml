authRefresh:
  post:
    tags:
    - Auth
    summary: Rotate refresh token và cấp token mới
    operationId: refreshToken
    description: POST được khóa cho P1. Refresh token rotate mỗi lần theo ADR-13.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/RefreshTokenRequest
    responses:
      '200':
        description: Refresh rotation thành công. Token cũ bị revoke.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/LoginResponse
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
    x-cab-trace:
    - UC-02
    - FR-02
    - PC-05
    - ADR-13
    x-contract-confidence: DESIGN_LOCKED
    parameters:
    - $ref: ../components/parameters.yaml#/CorrelationId
    x-cab-owner-service: identity-account-service
    x-cab-public-via: api-gateway
    x-cab-internal-transport: gRPC

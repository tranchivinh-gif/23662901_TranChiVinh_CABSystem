authRegisterCustomer:
  post:
    tags:
    - Auth
    summary: Đăng ký Customer
    operationId: registerCustomer
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/CustomerRegisterRequest
    responses:
      '201':
        description: Tạo Customer Active trực tiếp.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/AccountCreatedResponse
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
    x-cab-trace:
    - UC-01
    - FR-04
    - PC-01
    - PC-02
    x-contract-confidence: DESIGN_LOCKED
    description: Đăng ký Customer trực tiếp bằng họ tên, số điện thoại, email và mật khẩu; OTP không bắt buộc. Customer đăng nhập bằng email.
    parameters:
    - $ref: ../components/parameters.yaml#/CorrelationId
    x-cab-owner-service: identity-account-service
    x-cab-public-via: api-gateway
    x-cab-internal-transport: gRPC
    x-cab-orchestrates:
    - identity-account-service
    - customer-service
authLogin:
  post:
    tags:
    - Auth
    summary: Đăng nhập
    operationId: login
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/LoginRequest
    responses:
      '200':
        description: Cấp access/refresh token.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/LoginResponse
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
    x-cab-trace:
    - UC-02
    - FR-01
    - PC-03
    - PC-04
    - ADR-13
    x-contract-confidence: DESIGN_LOCKED
    parameters:
    - $ref: ../components/parameters.yaml#/CorrelationId
    x-cab-owner-service: identity-account-service
    x-cab-public-via: api-gateway
    x-cab-internal-transport: gRPC
authLogout:
  post:
    tags:
    - Auth
    summary: Đăng xuất và revoke refresh session
    operationId: logout
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/auth.yaml#/LogoutRequest
    responses:
      '200':
        description: Refresh session hiện tại đã bị revoke.
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
    x-cab-trace:
    - UC-02
    - FR-02
    - PC-05
    - ADR-13
    x-contract-confidence: DESIGN_LOCKED
    parameters:
    - $ref: ../components/parameters.yaml#/CorrelationId
    x-cab-owner-service: identity-account-service
    x-cab-public-via: api-gateway
    x-cab-internal-transport: gRPC

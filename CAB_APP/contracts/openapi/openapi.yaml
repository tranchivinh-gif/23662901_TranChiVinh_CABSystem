security:
- bearerAuth: []
x-cab-baseline:
  phase: P1
  srsBaseline: 1.0.1
  apiContractBaseline: 1.0.4
  decisionDate: '2026-10-03'
  architecture: API Gateway + 7 Spring Boot business services + gRPC + Kafka + PostgreSQL + Redis
  publicEntryPoint: API Gateway only
  basePath: /api/v1
  jsonNaming: camelCase
  queryNaming: camelCase
  publicStatusCasing: UPPER_SNAKE_CASE
  correlationHeader: X-Correlation-Id
  idempotencyRetentionHours: 24
  paymentWebhook:
    providerP1: mock
    signatureHeader: X-CAB-Signature
    timestampHeader: X-CAB-Timestamp
    algorithm: HMAC-SHA256
    replayWindowSeconds: 300
    signatureEncoding: lowercase-hex-64
  masking:
    staffPhone: '****** + last4'
    adminSensitiveAccess: full only when authorized + audited
  serviceArea: TP. Hồ Chí Minh
  serviceTypes:
  - MOTORBIKE
  - CAR_4_SEATS
  apiStatus: FINAL_LOCKED
x-cab-routing:
  publicEntryPoint: api-gateway
  publicProtocol: REST/HTTPS/JSON
  internalSynchronousProtocol: gRPC
  internalAsynchronousProtocol: Kafka
  businessServicePortsPublic: false

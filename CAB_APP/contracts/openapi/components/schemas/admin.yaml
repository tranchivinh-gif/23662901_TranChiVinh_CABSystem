      type: string
    phoneNumber:
      type: string
      description: 'Mask rule: self thấy full; Staff thấy ****** + 4 số cuối; Admin full only when authorized and access is
        audited.'
    fullName:
      type: string
    role:
      type: string
      enum:
      - STAFF
      - ADMIN
    status:
      type: string
      enum:
      - ACTIVE
      - DISABLED
  required:
  - accountId
  - phoneNumber
  - fullName
  - role
  - status
  additionalProperties: false
AdminAccountPage:
  type: object

AdminTripItem:
  type: object
  properties:
    trip:
      $ref: ./trip.yaml#/TripSummary
    timeInCurrentStateSeconds:
      type: integer
      minimum: 0
    stuckFlag:
      type: boolean
  required:
  - trip
  additionalProperties: true
AdminTripPage:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: ./admin.yaml#/AdminTripItem
    page:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
      maximum: 100
    totalItems:
      type: integer
      minimum: 0
    totalPages:
      type: integer
      minimum: 0
    total:
      type: integer
      minimum: 0
      description: Compatibility alias; MUST equal totalItems.
  required:
  - items
  - page
  - limit
  - totalItems
  - totalPages
  - total
  additionalProperties: false

      type: string
    password:
      type: string
      minLength: 8
    role:
      type: string
      enum:
      - STAFF
      - ADMIN
  required:
  - phoneNumber
  - fullName
  - password
  - role
  additionalProperties: false
AdminAccountUpdateRequest:
  type: object
  properties:
    fullName:
      type: string
    status:
      type: string
      enum:
      - ACTIVE
      - DISABLED
  minProperties: 1
  additionalProperties: false
AdminRoleUpdateRequest:
  type: object

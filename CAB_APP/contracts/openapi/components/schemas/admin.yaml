PolicyVersionRequest:
  type: object
  properties:
    effectiveAt:
      type: string
      format: date-time
    config:
      type: object
      additionalProperties: true
    reason:
      type: string
      minLength: 1
  required:
  - config
  - reason
  additionalProperties: false
PolicyVersionResponse:
  type: object
  properties:
    policyKey:
      type: string
    version:
      type: integer
      minimum: 1
    effectiveAt:
      type: string
      format: date-time
    config:
      type: object
      additionalProperties: true
    auditId:
      type: string
  required:
  - policyKey
  - version
  - effectiveAt
  - config
  - auditId
  additionalProperties: false
AuditLogRecord:
  type: object
  properties:
    auditId:
      type: string
    occurredAt:
      type: string
      format: date-time
    actorId:
      type: string
    action:
      type: string
    resourceType:
      type: string
    resourceId:
      type: string
    correlationId:
      type: string
      format: uuid
    result:
      type: string
    reason:
      type: string
    before:
      type: object
      additionalProperties: true
    after:
      type: object
      additionalProperties: true
  required:
  - auditId
  - occurredAt
  - actorId
  - action
  - resourceType
  - resourceId
  - correlationId
  - result
  additionalProperties: false
AuditLogPage:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: ./admin.yaml#/AuditLogRecord
    page:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
      maximum: 100
    totalItems:
      type: integer
      minimum: 0
    totalPages:
      type: integer
      minimum: 0
    total:
      type: integer
      minimum: 0
      description: Alias; MUST equal totalItems.
  required:
  - items
  - page
  - limit
  - totalItems
  - totalPages
  - total
  additionalProperties: false

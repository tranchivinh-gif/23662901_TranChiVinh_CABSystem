syntax = "proto3";
package cab.trip.v1;
import "common.proto";

service TripService {
  rpc CreateTrip(CreateTripRequest) returns (Trip);
  rpc GetTrip(cab.common.v1.IdRequest) returns (Trip);
  rpc Transition(TransitionRequest) returns (Trip);
  rpc CancelTrip(CancelRequest) returns (Trip);
  rpc RateTrip(RatingRequest) returns (Rating);
  rpc ApplyMatching(MatchingDecision) returns (Trip);
}
message CreateTripRequest { string booking_id = 1; string customer_id = 2; string driver_id = 3; string fare_snapshot_json = 4; string service_type = 5; string payment_method = 6; }
message Trip { string trip_id = 1; string booking_id = 2; string driver_id = 3; string status = 4; string customer_id = 5; string service_type = 6; string fare_json = 7; int32 cancellation_fee_vnd = 8; string payment_method = 9; string location_json = 10; }
message TransitionRequest { string trip_id = 1; string target_status = 2; string idempotency_key = 3; }
message CancelRequest { string trip_id = 1; string reason = 2; string idempotency_key = 3; }
message RatingRequest { string trip_id = 1; int32 score = 2; string comment = 3; }
message Rating { string rating_id = 1; string trip_id = 2; int32 score = 3; }
message MatchingDecision { string booking_id = 1; string trip_id = 2; string driver_id = 3; string target_state = 4; }

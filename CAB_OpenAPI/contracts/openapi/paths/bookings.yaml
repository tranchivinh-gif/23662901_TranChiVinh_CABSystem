customersCustomerIdBookings:
  get:
    tags:
    - Customer
    - Booking
    summary: Danh sách Booking của Customer có phân trang
    operationId: getCustomerBookings
    security:
    - bearerAuth: []
    parameters:
    - name: customerId
      in: path
      required: true
      schema:
        type: string
    - $ref: ../components/parameters.yaml#/Page
    - $ref: ../components/parameters.yaml#/Limit
    - $ref: ../components/parameters.yaml#/CorrelationId
    responses:
      '200':
        description: Booking page.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/booking.yaml#/BookingPage
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
    x-cab-trace:
    - GA-06
    - PC-59
    - §16.2.6
    x-contract-confidence: EXACT
    x-cab-owner-service: booking-service
    x-cab-public-via: api-gateway
    x-cab-internal-transport: gRPC

bookings:
  post:
    tags:
    - Booking
    summary: Tạo Booking và bắt đầu automatic matching
    operationId: createBooking
    description: 'Bắt buộc Idempotency-Key (retention 24h). Rate-limit grading: burst >1000 req/s phải quan sát 429 + Retry-After
      và hệ thống vẫn healthy. Unknown serviceType → 400 INVALID_SERVICE_TYPE; known but disabled → 409 SERVICE_TYPE_DISABLED;
      reuse same key different payload → 409 IDEMPOTENCY_KEY_REUSED.'
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters.yaml#/IdempotencyKey
    - $ref: ../components/parameters.yaml#/CorrelationId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/booking.yaml#/BookingCreateRequest
    responses:
      '201':
        description: Booking tạo đúng một lần; public state SEARCHING.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/booking.yaml#/BookingSummary
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '429':
        $ref: ../components/responses.yaml#/TooManyRequests
      '503':
        $ref: ../components/responses.yaml#/ServiceUnavailable
    x-cab-trace:
    - UC-04
    - FR-06..08
    - PC-08..10
    - §16.2.6
    - ADR-21 §21.10
    x-contract-confidence: EXACT
    x-cab-owner-service: booking-service
    x-cab-public-via: api-gateway
    x-cab-internal-transport: gRPC
    x-cab-orchestrates:
    - booking-service
    - driver-service
    - trip-service

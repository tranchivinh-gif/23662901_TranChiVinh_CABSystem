  /webhooks/payment/{provider}:
    post:
      tags:
      - Payment
      summary: Payment Provider callback/webhook
      operationId: paymentWebhook
      description: P1 provider path value = mock. Signature = HMAC-SHA256 over `${timestamp}.${providerReference}.${amount}.${status}`.
        Replay window ±300s. Duplicate valid callback returns 200 duplicate-safe. Invalid signature → 401 INVALID_WEBHOOK_SIGNATURE;
        amount/reference mismatch or stale replay → 409 PAYMENT_CALLBACK_MISMATCH/WEBHOOK_REPLAY_REJECTED.
      security: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - mock
      - $ref: '#/components/parameters/PaymentWebhookTimestamp'
      - $ref: '#/components/parameters/PaymentWebhookSignature'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookRequest'
      responses:
        '200':
          description: Callback hợp lệ/idempotent; success expose public status COMPLETED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentWebhookResponse'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          description: Malformed callback body/header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '401':
          description: INVALID_WEBHOOK_SIGNATURE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '409':
          description: PAYMENT_CALLBACK_MISMATCH hoặc WEBHOOK_REPLAY_REJECTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'

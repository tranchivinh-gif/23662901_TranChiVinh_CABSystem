components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT; header có kid; access token TTL 15 phút theo ADR-13.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Trang bắt đầu từ 0.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Bắt buộc cho command replay-sensitive. Dedup window P1 = 24 giờ theo actor + endpoint + key + request hash;
        cùng key khác payload → 409 IDEMPOTENCY_KEY_REUSED.
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Optional request correlation ID. Nếu thiếu, Gateway tự sinh; response trả lại X-Correlation-Id.
    PaymentWebhookSignature:
      name: X-CAB-Signature
      in: header
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
        description: Lowercase hex HMAC-SHA256 digest (64 hex chars).
      description: Lowercase-hex HMAC-SHA256 của canonical UTF-8 string `${timestamp}.${providerReference}.${amount}.${status}`
        bằng webhook secret của provider.
    PaymentWebhookTimestamp:
      name: X-CAB-Timestamp
      in: header
      required: true
      schema:
        type: integer
        format: int64
      description: Unix epoch seconds. P1 replay window = ±300 giây so với server time.
  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
    Unauthorized:
      description: Chưa xác thực / JWT không hợp lệ / chữ ký webhook sai khi áp dụng.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
    Forbidden:
      description: Không đủ quyền.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
    NotFound:
      description: Không tìm thấy tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
    Conflict:
      description: Xung đột trạng thái hoặc idempotency.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
    TooManyRequests:
      description: Vượt rate limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        Retry-After:
          description: Thời gian client nên chờ trước khi retry.
          schema:
            type: string
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
    ServiceUnavailable:
      description: Dependency nội bộ bắt buộc chưa sẵn sàng.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
  headers:
    CorrelationId:
      description: Correlation ID của request. Gateway dùng giá trị hợp lệ từ client hoặc tự sinh UUID và truyền xuyên gRPC/Kafka.
      schema:
        type: string
        format: uuid
  schemas:
    AdminCustomerUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
      additionalProperties: true
    ReasonRequest:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
      additionalProperties: true
    DriverDecisionRequest:
      type: object
      properties:
        reason:
          type: string
          description: Reject bắt buộc lý do; Approve có thể không cần reason nhưng payload cho phép để audit.
      additionalProperties: true
    AdminTripItem:
      type: object
      properties:
        trip:
          $ref: '#/components/schemas/TripSummary'
        timeInCurrentStateSeconds:
          type: integer
          minimum: 0
        stuckFlag:
          type: boolean
      required:
      - trip
      additionalProperties: true
    AdminTripPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminTripItem'
        page:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: Compatibility alias; MUST equal totalItems.
      required:
      - items
      - page
      - limit
      - totalItems
      - totalPages
      - total
      additionalProperties: false
    AdminDriverOnlinePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DriverProfile'
        page:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: Compatibility alias; MUST equal totalItems.
      required:
      - items
      - page
      - limit
      - totalItems
      - totalPages
      - total
      additionalProperties: false
    AdminCustomerPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerProfile'
        page:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: Compatibility alias; MUST equal totalItems.
      required:
      - items
      - page
      - limit
      - totalItems
      - totalPages
      - total
      additionalProperties: false
    VehicleAdminRequest:
      type: object
      properties:
        driverId:
          type: string
        licensePlate:
          type: string
        serviceType:
          type: string
          enum:
          - MOTORBIKE
          - CAR_4_SEATS
        active:
          type: boolean
        make:
          type: string
        model:
          type: string
        color:
          type: string
        seatCount:
          type: integer
          minimum: 1
      required:

      - licensePlate
      - serviceType
      additionalProperties: true
    VehiclePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VehicleSummary'
        page:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: Compatibility alias; MUST equal totalItems.
      required:
      - items
      - page
      - limit
      - totalItems
      - totalPages
      - total
      additionalProperties: false
    AdminDriverPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DriverProfile'
        page:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: Alias; MUST equal totalItems.
      required:
      - items
      - page
      - limit
      - totalItems
      - totalPages
      - total
      additionalProperties: false
    AdminActionResponse:
      type: object
      properties:
        resourceId:
          type: string
        action:
          type: string
        status:
          type: string
        auditId:
          type: string
      required:

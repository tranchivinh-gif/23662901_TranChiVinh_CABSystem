openapi: 3.1.0
info:
  title: CAB System Public API — Final Modular Contract
  version: 1.0.4
  description: 'CAB System Public API Contract P1 — FINAL/LOCKED baseline 1.0.4. Public REST contract is exposed only through
    API Gateway. This release changes file organization only: one root OpenAPI document with modular paths/components. The
    62 paths and 64 operations from baseline 1.0.3 are preserved.'
  x-source-documents:
  - srs_baseline_1.0.1(4).md
  - mcroservice_design_final(3).md
  x-refactor:
    fromBaseline: 1.0.3
    type: non-breaking structural modularization
    status: FINAL_LOCKED
    principle: one public Gateway OpenAPI; split paths/components only; no per-microservice public REST specs
servers:
- url: /
  description: P1 public API Gateway root. Không dùng version prefix trong P1 để giữ exact grading paths như /health, /auth/login,
    /bookings.
tags:
- name: Health
- name: Auth
- name: Customer
- name: Driver
- name: Booking
- name: Trip
- name: Payment
- name: Admin
- name: Offer
- name: Audit
- name: Policy
- name: Account
security:
- bearerAuth: []
x-cab-baseline:
  phase: P1
  srsBaseline: 1.0.1
  apiContractBaseline: 1.0.4
  decisionDate: '2026-10-03'
  architecture: API Gateway + 7 Spring Boot business services + gRPC + Kafka + PostgreSQL + Redis
  publicEntryPoint: API Gateway only
  basePath: /
  jsonNaming: camelCase
  queryNaming: camelCase
  publicStatusCasing: UPPER_SNAKE_CASE
  correlationHeader: X-Correlation-Id
  idempotencyRetentionHours: 24
  paymentWebhook:
    providerP1: mock
    signatureHeader: X-CAB-Signature
    timestampHeader: X-CAB-Timestamp
    algorithm: HMAC-SHA256
    replayWindowSeconds: 300
    signatureEncoding: lowercase-hex-64
  masking:
    staffPhone: '****** + last4'
    adminSensitiveAccess: full only when authorized + audited
  serviceArea: TP. Hồ Chí Minh
  serviceTypes:
  - MOTORBIKE
  - CAR_4_SEATS
  apiStatus: FINAL_LOCKED
x-cab-routing:
  publicEntryPoint: api-gateway
  publicProtocol: REST/HTTPS/JSON
  internalSynchronousProtocol: gRPC
  internalAsynchronousProtocol: Kafka
  businessServicePortsPublic: false

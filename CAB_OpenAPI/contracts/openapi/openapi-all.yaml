      operationId: listTrips
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - SEARCHING
          - DRIVER_ASSIGNED
          - ARRIVED
          - PICKED_UP
          - IN_PROGRESS
          - COMPLETED
          - CANCELED
          - FAILED
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/CorrelationId'

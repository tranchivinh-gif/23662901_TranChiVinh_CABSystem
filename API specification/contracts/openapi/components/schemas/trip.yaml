TripSummary:
  type: object
  properties:
    tripId:
      type: string
    bookingId:
      type: string
    customerId:
      type: string
    driverId:
      type: string
    state:
      type: string
      enum:
      - SEARCHING
      - DRIVER_ASSIGNED
      - ARRIVED
      - PICKED_UP
      - IN_PROGRESS
      - COMPLETED
      - CANCELED
      - FAILED
    serviceType:
      type: string
    pickup:
      $ref: ./common.yaml#/GeoPoint
    destination:
      $ref: ./common.yaml#/GeoPoint
    driver:
      $ref: ./driver.yaml#/DriverProfile
    etaMinutes:
      type: number
      minimum: 0
    fare:
      $ref: ./booking.yaml#/FareBreakdown
    paymentStatus:
      type: string
      enum:
      - PENDING
      - COMPLETED
      - FAILED
  required:
  - tripId
  - bookingId
  - customerId
  - state
  - serviceType
  additionalProperties: false
TripPage:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: ./trip.yaml#/TripSummary
    page:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
      maximum: 100
    totalItems:
      type: integer
      minimum: 0
    totalPages:
      type: integer
      minimum: 0
    total:
      type: integer
      minimum: 0
      description: Compatibility alias; MUST equal totalItems.
  required:
  - items
  - page
  - limit
  - totalItems
  - totalPages
  - total
  additionalProperties: false
TripActionResponse:
  type: object
  properties:
    tripId:
      type: string
    state:
      type: string
      enum:
      - ARRIVED
      - PICKED_UP
      - IN_PROGRESS
      - COMPLETED
    fare:
      $ref: ./booking.yaml#/FareBreakdown
  required:
  - tripId
  - state
  additionalProperties: false
TripCancelRequest:
  type: object
  properties:
    reason:
      type: string
      description: Lý do hủy.
  additionalProperties: false
  required:
  - reason
TripCancelResponse:
  type: object
  properties:
    tripId:
      type: string
    state:
      type: string
      enum:
      - CANCELED
    cancellationFeeVnd:
      type: integer
      minimum: 0
  required:
  - tripId
  - state
  - cancellationFeeVnd
  additionalProperties: false
RatingRequest:
  type: object
  properties:
    stars:
      type: integer
      minimum: 1
      maximum: 5
    comment:
      type: string
  required:
  - stars
  additionalProperties: false
RatingResponse:
  type: object
  properties:
    tripId:
      type: string
    ratingId:
      type: string
    stars:
      type: integer
      minimum: 1
      maximum: 5
  required:
  - tripId
  - ratingId
  - stars
  additionalProperties: false

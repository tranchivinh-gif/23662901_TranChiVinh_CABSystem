VehicleSummary:
  type: object
  properties:
    vehicleId:
      type: string
    licensePlate:
      type: string
    serviceType:
      type: string
      enum:
      - MOTORBIKE
      - CAR_4_SEATS
    make:
      type: string
    model:
      type: string
    color:
      type: string
    active:
      type: boolean
  additionalProperties: true
DriverProfile:
  type: object
  properties:
    driverId:
      type: string
    fullName:
      type: string
    phoneNumber:
      type: string
      description: 'Mask rule: self thấy full; Staff thấy ****** + 4 số cuối; Admin full only when authorized and access is
        audited.'
    approvalStatus:
      type: string
      enum:
      - PENDING
      - ACTIVE
      - REJECTED
      - SUSPENDED
    availability:
      type: string
      enum:
      - ONLINE
      - OFFLINE
      - BUSY
      description: ONLINE maps domain Available; OFFLINE maps Offline; BUSY is system-controlled.
    rating:
      type: number
      minimum: 1
      maximum: 5
    vehicle:
      $ref: ./driver.yaml#/VehicleSummary
    currentLocation:
      $ref: ./common.yaml#/GeoPoint
  required:
  - driverId
  - fullName
  - approvalStatus
  - availability
  additionalProperties: false
AvailabilityUpdateRequest:
  type: object
  properties:
    availability:
      type: string
      description: ONLINE map domain Available; OFFLINE map domain Offline.
      enum:
      - ONLINE
      - OFFLINE
  required:
  - availability
  additionalProperties: false
NearbyDriverItem:
  type: object
  properties:
    driver:
      $ref: ./driver.yaml#/DriverProfile
    distanceKm:
      type: number
      minimum: 0
  required:
  - driver
  additionalProperties: true
NearbyDriverPage:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: ./driver.yaml#/NearbyDriverItem
    page:
      type: integer
      minimum: 0
    limit:
      type: integer
      minimum: 1
      maximum: 100
    totalItems:
      type: integer
      minimum: 0
    totalPages:
      type: integer
      minimum: 0
    total:
      type: integer
      minimum: 0
      description: Compatibility alias; MUST equal totalItems.
  required:
  - items
  - page
  - limit
  - totalItems
  - totalPages
  - total
  additionalProperties: false
DriverSelfUpdateRequest:
  type: object
  properties:
    fullName:
      type: string
    phoneNumber:
      type: string
    vehicle:
      type: object
      properties:
        licensePlate:
          type: string
        make:
          type: string
          description: Hãng xe
        model:
          type: string
          description: Mẫu xe
        color:
          type: string
        serviceType:
          type: string
          enum:
          - MOTORBIKE
          - CAR_4_SEATS
        seatCount:
          type: integer
          minimum: 1
      required:
      - licensePlate
      - serviceType
      additionalProperties: true
  additionalProperties: false
  minProperties: 1
DriverLocationUpdateRequest:
  type: object
  properties:
    lat:
      type: number
      minimum: -90
      maximum: 90
    lng:
      type: number
      minimum: -180
      maximum: 180
    heading:
      type: number
      minimum: 0
      exclusiveMaximum: 360
    speed:
      type: number
      minimum: 0
    accuracy:
      type: number
      minimum: 0
    timestamp:
      type: string
      format: date-time
  required:
  - lat
  - lng
  - timestamp
  additionalProperties: false
DriverLocationUpdateResponse:
  type: object
  properties:
    driverId:
      type: string
    acceptedAt:
      type: string
      format: date-time
    availability:
      type: string
      enum:
      - ONLINE
      - OFFLINE
      - BUSY
  required:
  - driverId
  - acceptedAt
  - availability
  additionalProperties: false

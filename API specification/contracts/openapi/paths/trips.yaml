      schema:
        type: string
    - $ref: ../components/parameters.yaml#/CorrelationId
    responses:
      '200':
        description: Chi tiết Trip theo quyền.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trip.yaml#/TripSummary
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':

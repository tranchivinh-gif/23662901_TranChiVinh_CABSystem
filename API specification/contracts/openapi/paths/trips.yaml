trips:
  get:
    tags:
    - Trip
    summary: Lịch sử Trip của Customer
    operationId: listTrips
    security:
    - bearerAuth: []
    parameters:
    - $ref: ../components/parameters.yaml#/Page
    - $ref: ../components/parameters.yaml#/Limit
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - SEARCHING
        - DRIVER_ASSIGNED
        - ARRIVED
        - PICKED_UP
        - IN_PROGRESS
        - COMPLETED
        - CANCELED
        - FAILED
    - name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    - $ref: ../components/parameters.yaml#/CorrelationId
    responses:
      '200':
        description: Trip history mới nhất trước, có phân trang.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trip.yaml#/TripPage
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
    x-cab-trace:
    - UC-07
    - FR-11
    - PC-32
    x-contract-confidence: DESIGN_LOCKED
    x-cab-owner-service: trip-service
    x-cab-public-via: api-gateway
    x-cab-internal-transport: gRPC
tripsId:

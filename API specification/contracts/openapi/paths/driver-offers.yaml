driverOffersOfferIdAccept:
  post:
    tags:
    - Offer
    - Booking
    - Driver
    summary: Driver chấp nhận offer
    operationId: acceptDriverOffer
    description: Driver chỉ accept offer của chính mình. Expired/canceled/already-assigned → 409. Duplicate cùng Idempotency-Key
      trả cùng business result.
    security:
    - bearerAuth: []
    parameters:
    - name: offerId
      in: path
      required: true
      schema:
        type: string
    - $ref: ../components/parameters.yaml#/IdempotencyKey
    - $ref: ../components/parameters.yaml#/CorrelationId
    responses:
      '200':
        description: Offer accepted exactly once; Trip DRIVER_ASSIGNED.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/booking.yaml#/DriverOfferActionResponse
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
    x-cab-trace:
    - UC-15
    - FR-19
    - PC-13
    - PC-17
    x-contract-confidence: DESIGN_LOCKED
    x-cab-owner-service: booking-service
    x-cab-public-via: api-gateway
    x-cab-internal-transport: gRPC
    x-cab-orchestrates:
    - booking-service
    - driver-service
    - trip-service
driverOffersOfferIdReject:
  post:
    tags:
    - Offer
    - Booking
    - Driver
    summary: Driver từ chối offer
    operationId: rejectDriverOffer
    security:
    - bearerAuth: []
    parameters:
    - name: offerId
      in: path
      required: true
      schema:
        type: string
    - $ref: ../components/parameters.yaml#/CorrelationId
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas/booking.yaml#/OfferRejectRequest
    responses:
      '200':
        description: Offer REJECTED; booking-service redispatch nếu còn candidate.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/booking.yaml#/DriverOfferActionResponse
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
    x-cab-trace:
    - UC-15
    - UC-19
    - FR-19
    - FR-26
    - PC-14
    x-contract-confidence: DESIGN_LOCKED
    x-cab-owner-service: booking-service
    x-cab-public-via: api-gateway
    x-cab-internal-transport: gRPC
    x-cab-orchestrates:
    - booking-service

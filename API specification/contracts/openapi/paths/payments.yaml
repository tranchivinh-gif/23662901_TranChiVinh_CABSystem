webhooksPaymentProvider:
  post:
    tags:
    - Payment
    summary: Payment Provider callback/webhook
    operationId: paymentWebhook
    description: P1 provider path value = mock. Signature = HMAC-SHA256 over `${timestamp}.${providerReference}.${amount}.${status}`.
      Replay window ±300s. Duplicate valid callback returns 200 duplicate-safe. Invalid signature → 401 INVALID_WEBHOOK_SIGNATURE;
      amount/reference mismatch or stale replay → 409 PAYMENT_CALLBACK_MISMATCH/WEBHOOK_REPLAY_REJECTED.
    security: []
    parameters:
    - name: provider
      in: path
      required: true
      schema:
        type: string
        enum:
        - mock
    - $ref: ../components/parameters.yaml#/PaymentWebhookTimestamp
    - $ref: ../components/parameters.yaml#/PaymentWebhookSignature
    - $ref: ../components/parameters.yaml#/CorrelationId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/payment.yaml#/PaymentWebhookRequest
    responses:
      '200':
        description: Callback hợp lệ/idempotent; success expose public status COMPLETED.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/payment.yaml#/PaymentWebhookResponse
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '400':
        description: Malformed callback body/header.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '401':
        description: INVALID_WEBHOOK_SIGNATURE.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
      '409':
        description: PAYMENT_CALLBACK_MISMATCH hoặc WEBHOOK_REPLAY_REJECTED.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
        headers:
          X-Correlation-Id:
            $ref: ../components/headers.yaml#/CorrelationId
    x-cab-trace:
    - UC-21
    - FR-31
    - PC-27
    - PC-28
    - §16.2.6
    - ADR-18
    x-contract-confidence: DESIGN_LOCKED
    x-cab-owner-service: payment-service
    x-cab-public-via: api-gateway
    x-cab-internal-transport: gRPC
